# Self-hosting. Easiest: scripts/install.sh does everything below.
# By hand: cp .env.example .env, set DOMAIN, APP_URL and APP_SECRET, then `docker compose --profile https up -d`
# (or plain `docker compose up -d` if you already run a reverse proxy in front of port 3000).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: incnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incnet}
      POSTGRES_DB: incnet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incnet"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://incnet:${POSTGRES_PASSWORD:-incnet}@db:5432/incnet
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Automatic HTTPS. Started by scripts/install.sh (docker compose --profile https up -d).
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data
    depends_on:
      - app

volumes:
  pgdata:
  caddy:
